<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频情绪离线分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            margin: 0;
            color: #222;
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .upload-section { background: white; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .upload-input { display: flex; gap: 12px; align-items: center; }
        #video-file { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; flex: 1; }
        button { padding: 10px 20px; background: #1677ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0d47a1; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .progress-section { background: white; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; }
        .progress-bar { width: 100%; height: 24px; background: #e8e8e8; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #52c41a, #faad14); width: 0%; transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold; }
        .status-text { font-size: 13px; color: #666; }
        .results-section { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-wrapper { position: relative; height: 350px; }
        .stats { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #f5f5f5; padding: 12px; border-radius: 6px; text-align: center; border: 1px solid #ddd; }
        .stat-label { font-size: 12px; color: #666; margin-bottom: 6px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #1677ff; }
        .export-btn { width: 100%; padding: 12px; background: #52c41a; color: white; margin-top: 20px; }
        .export-btn:hover { background: #389e0d; }
        .hidden { display: none !important; }
        .error { color: #ff4d4f; padding: 12px; background: #fff1f0; border-radius: 4px; margin-bottom: 12px; }
        .success { color: #52c41a; padding: 12px; background: #f6ffed; border-radius: 4px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📹 视频情绪离线分析</h1>

        <div class="upload-section">
            <div class="upload-input">
                <input type="text" id="student-id-input" placeholder="学生名字（可选）" maxlength="30" style="flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px;" />
                <input type="file" id="video-file" accept="video/*" />
                <button id="analyze-btn">开始分析</button>
            </div>
            <div id="error-msg" class="error hidden"></div>
            <div id="success-msg" class="success hidden"></div>
        </div>

        <div id="progress-section" class="progress-section">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill">0%</div>
            </div>
            <div class="status-text">
                <span id="status-text">准备中...</span> | <span id="frame-info">0/0</span> | <span id="time-info">0s</span>
            </div>
        </div>

        <div id="results-section" class="results-section hidden">
            <h2>分析结果</h2>
            <div class="stats" id="emotion-stats"></div>

            <div class="charts-grid">
                <div class="chart-wrapper">
                    <canvas id="timeline-chart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="pie-chart"></canvas>
                </div>
            </div>

            <button class="export-btn" id="export-btn">📥 导出分析报告 (CSV)</button>
        </div>
    </div>

    <script>
        const emotions = ["生气", "厌恶", "恐惧", "开心", "难过", "惊讶", "中性"];
        let session = null;
        let yunetSession = null;
        let analysisResults = [];
        let cloudbaseApp = null;
        let cloudbaseDb = null;

        const videoInput = document.getElementById('video-file');
        const analyzeBtn = document.getElementById('analyze-btn');
        const progressSection = document.getElementById('progress-section');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const frameInfo = document.getElementById('frame-info');
        const timeInfo = document.getElementById('time-info');
        const resultsSection = document.getElementById('results-section');
        const emotionStats = document.getElementById('emotion-stats');
        const exportBtn = document.getElementById('export-btn');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const studentIdInput = document.getElementById('student-id-input');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            successMsg.classList.add('hidden');
        }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.classList.remove('hidden');
            errorMsg.classList.add('hidden');
        }

        function softmax(logits) {
            const logitsArray = Array.from(logits);
            const max = Math.max(...logitsArray);
            const exps = logitsArray.map(v => Math.exp(v - max));
            const sum = exps.reduce((a, b) => a + b, 0);
            return exps.map(v => (v / sum) * 100);
        }

        function findMaxIndex(arr) {
            let maxIdx = 0, maxVal = arr[0];
            for (let i = 1; i < arr.length; i++) {
                if (arr[i] > maxVal) { maxVal = arr[i]; maxIdx = i; }
            }
            return maxIdx;
        }

        async function loadModel() {
            if (session && yunetSession) return;
            statusText.textContent = '正在加载 ONNX 模型...';

            if (!window.ort) {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/onnxruntime-web/dist/ort.min.js';
                document.head.appendChild(script);
                await new Promise(r => script.onload = r);
            }

            if (!session) {
                session = await window.ort.InferenceSession.create('./emotion.onnx');
            }
            if (!yunetSession) {
                yunetSession = await window.ort.InferenceSession.create('./face_detection_yunet_2023mar.onnx');
            }
            statusText.textContent = '模型加载完成';
        }

        async function detectFaceYunetFromVideo(videoElement, targetWidth, targetHeight) {
            if (!yunetSession) return { detected: false };

            try {
                const inputSize = 640;
                const detectionCanvas = document.createElement('canvas');
                detectionCanvas.width = inputSize;
                detectionCanvas.height = inputSize;
                const detectionCtx = detectionCanvas.getContext('2d', { willReadFrequently: true });
                detectionCtx.drawImage(videoElement, 0, 0, targetWidth, targetHeight, 0, 0, inputSize, inputSize);

                const resizedData = detectionCtx.getImageData(0, 0, inputSize, inputSize).data;
                const input = new Float32Array(3 * inputSize * inputSize);

                // NCHW format
                for (let i = 0; i < inputSize * inputSize; i++) {
                    const r = resizedData[i * 4];
                    const g = resizedData[i * 4 + 1];
                    const b = resizedData[i * 4 + 2];

                    input[i] = r;
                    input[inputSize * inputSize + i] = g;
                    input[2 * inputSize * inputSize + i] = b;
                }

                const tensor = new window.ort.Tensor('float32', input, [1, 3, inputSize, inputSize]);
                const output = await yunetSession.run({ input: tensor });

                const candidates = [];
                const scales = [8, 16, 32];

                for (const scale of scales) {
                    const objKey = `obj_${scale}`;
                    const bboxKey = `bbox_${scale}`;

                    if (!output[objKey] || !output[bboxKey]) continue;

                    const objData = output[objKey].data;
                    const bboxData = output[bboxKey].data;
                    const gridSize = inputSize / scale;

                    for (let y = 0; y < gridSize; y++) {
                        for (let x = 0; x < gridSize; x++) {
                            const idx = y * gridSize + x;
                            const confidence = objData[idx];

                            if (confidence < 0.5) continue;

                            const bboxIdx = idx * 4;
                            const gridCellSize = scale;
                            const cellCenterX = (x + 0.5) * gridCellSize;
                            const cellCenterY = (y + 0.5) * gridCellSize;

                            let cx = cellCenterX + bboxData[bboxIdx] * gridCellSize;
                            let cy = cellCenterY + bboxData[bboxIdx + 1] * gridCellSize;
                            let w = bboxData[bboxIdx + 2] * gridCellSize;
                            let h = bboxData[bboxIdx + 3] * gridCellSize;

                            candidates.push({
                                x: Math.max(0, Math.min(1, (cx - w / 2) / inputSize)),
                                y: Math.max(0, Math.min(1, (cy - h / 2) / inputSize)),
                                w: Math.max(0, Math.min(1, w / inputSize)),
                                h: Math.max(0, Math.min(1, h / inputSize)),
                                confidence: confidence
                            });
                        }
                    }
                }

                if (candidates.length === 0) {
                    return { detected: false };
                }

                candidates.sort((a, b) => b.confidence - a.confidence);
                const bestFace = candidates[0];

                // Add 40% margin to ensure complete face is captured
                const margin = 0.4;
                let left = Math.max(0, bestFace.x - margin / 2);
                let top = Math.max(0, bestFace.y - margin / 2);
                let right = Math.min(1, bestFace.x + bestFace.w + margin / 2);
                let bottom = Math.min(1, bestFace.y + bestFace.h + margin / 2);

                let box = {
                    x: left,
                    y: top,
                    w: right - left,
                    h: bottom - top
                };

                return {
                    detected: true,
                    box: { x: box.x, y: box.y, w: box.w, h: box.h },
                    confidence: bestFace.confidence
                };
            } catch (err) {
                console.error('YuNet detection error:', err);
                return { detected: false };
            }
        }

        async function analyzeVideo() {
            const file = videoInput.files[0];
            if (!file) {
                showError('请先选择视频文件');
                return;
            }

            try {
                await loadModel();
                progressSection.style.display = 'block';
                resultsSection.classList.add('hidden');
                errorMsg.classList.add('hidden');
                successMsg.classList.add('hidden');

                analysisResults = [];
                const video = document.createElement('video');
                const croppedCanvas = document.createElement('canvas');
                const croppedCtx = croppedCanvas.getContext('2d');
                croppedCanvas.width = 48;
                croppedCanvas.height = 48;

                video.src = URL.createObjectURL(file);
                video.crossOrigin = 'anonymous';

                await new Promise(resolve => {
                    video.onloadedmetadata = resolve;
                });

                const fps = 2; // 每秒采样 2 帧
                const duration = video.duration;
                const frameCount = Math.ceil(duration * fps);

                statusText.textContent = '分析中...';

                let detectedFrames = 0;

                for (let i = 0; i < frameCount; i++) {
                    const timestamp = (i / fps);
                    if (timestamp > duration) break;

                    video.currentTime = timestamp;
                    await new Promise(r => setTimeout(r, 50)); // 等待帧加载

                    // 第一步：YuNet 人脸检测
                    const yunetResult = await detectFaceYunetFromVideo(video, video.videoWidth, video.videoHeight);

                    if (!yunetResult.detected) {
                        // 更新进度但不保存分析结果
                        const progress = ((i + 1) / frameCount) * 100;
                        progressFill.style.width = progress + '%';
                        progressFill.textContent = Math.round(progress) + '%';
                        frameInfo.textContent = `${i + 1}/${frameCount}（无人脸）`;
                        timeInfo.textContent = `${timestamp.toFixed(1)}s`;
                        continue;
                    }

                    // 第二步：根据 YuNet bbox 裁剪人脸区域
                    const box = yunetResult.box;
                    const cropX = Math.max(0, Math.floor(box.x * video.videoWidth));
                    const cropY = Math.max(0, Math.floor(box.y * video.videoHeight));
                    const cropW = Math.min(video.videoWidth - cropX, Math.floor(box.w * video.videoWidth));
                    const cropH = Math.min(video.videoHeight - cropY, Math.floor(box.h * video.videoHeight));

                    croppedCtx.clearRect(0, 0, 48, 48);
                    croppedCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 48, 48);

                    // 第三步：情绪分析
                    const imgData = croppedCtx.getImageData(0, 0, 48, 48).data;
                    const contrast = 1.3;
                    const intercept = 128 * (1 - contrast);
                    const input = new Float32Array(3 * 48 * 48);

                    for (let j = 0; j < 48 * 48; j++) {
                        for (let c = 0; c < 3; c++) {
                            let val = imgData[j * 4 + c];
                            val = val * contrast + intercept;
                            input[j + c * 2304] = Math.max(0, Math.min(255, val)) / 255.0;
                        }
                    }

                    // ONNX 推理
                    const tensor = new window.ort.Tensor('float32', input, [1, 3, 48, 48]);
                    const output = await session.run({ images: tensor });
                    const results = output[Object.keys(output)[0]].data;
                    const probs = softmax(results);
                    const maxIdx = findMaxIndex(probs);

                    analysisResults.push({
                        timestamp: parseFloat(timestamp.toFixed(2)),
                        emotion: emotions[maxIdx],
                        emotionIdx: maxIdx,
                        probabilities: probs,
                        faceConfidence: yunetResult.confidence
                    });

                    detectedFrames++;

                    // 更新进度
                    const progress = ((i + 1) / frameCount) * 100;
                    progressFill.style.width = progress + '%';
                    progressFill.textContent = Math.round(progress) + '%';
                    frameInfo.textContent = `${detectedFrames}/${i + 1}（检测到人脸）`;
                    timeInfo.textContent = `${timestamp.toFixed(1)}s`;
                }

                URL.revokeObjectURL(video.src);
                displayResults();
                showSuccess(`✅ 分析完成！检测到人脸 ${detectedFrames}/${frameCount} 帧`);

            } catch (err) {
                showError('分析失败: ' + err.message);
                console.error(err);
            }
        }

        function displayResults() {
            resultsSection.classList.remove('hidden');

            // 计算统计数据
            const emotionCounts = new Array(7).fill(0);
            analysisResults.forEach(result => {
                emotionCounts[result.emotionIdx]++;
            });

            // 显示统计卡片
            emotionStats.innerHTML = emotions.map((name, idx) => {
                const count = emotionCounts[idx];
                const percent = analysisResults.length > 0 ? ((count / analysisResults.length) * 100).toFixed(1) : 0;
                return `
                    <div class="stat-card">
                        <div class="stat-label">${name}</div>
                        <div class="stat-value">${percent}%</div>
                        <div style="font-size: 11px; color: #999;">${count}帧</div>
                    </div>
                `;
            }).join('');

            // 时间轴图表
            const timeLabels = analysisResults.map(r => r.timestamp + 's');
            const emotionIndices = analysisResults.map(r => r.emotionIdx);

            const timelineCtx = document.getElementById('timeline-chart').getContext('2d');
            if (window.timelineChart) window.timelineChart.destroy();
            window.timelineChart = new Chart(timelineCtx, {
                type: 'line',
                data: {
                    labels: timeLabels,
                    datasets: [{
                        label: '主导情绪',
                        data: emotionIndices,
                        borderColor: '#1677ff',
                        backgroundColor: 'rgba(22, 119, 255, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 6,
                            ticks: {
                                callback: value => emotions[value] || value
                            }
                        }
                    },
                    plugins: {
                        legend: { display: true }
                    }
                }
            });

            // 饼图
            const pieCtx = document.getElementById('pie-chart').getContext('2d');
            if (window.pieChart) window.pieChart.destroy();
            window.pieChart = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: emotions,
                    datasets: [{
                        data: emotionCounts,
                        backgroundColor: [
                            '#ff7a45', '#ff9c6e', '#ffc069', '#ffd975', '#ffe58f', '#fff7e6', '#f0f0f0'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        function exportCSV() {
            if (analysisResults.length === 0) {
                showError('暂无数据可导出');
                return;
            }

            const headers = ['时间(s)', '主导情绪', ...emotions.map((_, i) => `${emotions[i]}(%)`)];
            const rows = [headers.join(',')];

            analysisResults.forEach(result => {
                const row = [
                    result.timestamp,
                    result.emotion,
                    ...result.probabilities.map(p => p.toFixed(1))
                ];
                rows.push(row.map(v => `"${v}"`).join(','));
            });

            const csv = rows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', 'video_analysis_report.csv');
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showSuccess('✅ 导出成功');
        }

        // ============================================================
        // CloudBase 初始化与上传
        // ============================================================

        async function initCloudbase() {
            try {
                if (cloudbaseApp) {
                    console.log('[CloudBase] 已初始化，复用连接');
                    return;
                }

                if (!window.cloudbase) {
                    throw new Error("CloudBase SDK未加载，请检查网络连接或刷新页面");
                }

                console.log('[CloudBase] 开始初始化...');

                cloudbaseApp = window.cloudbase.init({
                    env: 'xiudongspace-1go2y2fxe6bb2292'
                });
                cloudbaseDb = cloudbaseApp.database();

                const auth = cloudbaseApp.auth();
                if (!auth.hasLoginState()) {
                    console.log('[CloudBase] 执行匿名登录...');
                    await auth.signInAnonymously();
                    console.log('[CloudBase] 匿名登录成功');
                } else {
                    console.log('[CloudBase] 已有登录状态');
                }

                console.log('[CloudBase] ✅ 初始化成功');
            } catch (err) {
                console.error('[CloudBase] ❌ 初始化失败:', err);
                throw new Error(`CloudBase初始化失败: ${err.message}`);
            }
        }

        async function uploadToCloudbase() {
            try {
                if (!analysisResults || analysisResults.length === 0) {
                    showError('暂无分析数据可上传');
                    statusText.textContent = '❌ 暂无分析数据';
                    return;
                }

                statusText.textContent = '⏳ 正在初始化云连接...';
                exportBtn.disabled = true;

                await initCloudbase();

                statusText.textContent = '⏳ 正在准备上传数据...';

                // 计算汇总数据
                const emotionCounts = new Array(7).fill(0);
                analysisResults.forEach(result => {
                    emotionCounts[result.emotionIdx]++;
                });

                const videoName = videoInput.files[0] ? videoInput.files[0].name : 'unknown.mp4';
                const studentId = (studentIdInput.value || '视频分析').trim();

                console.log('[上传] 准备数据:', {
                    studentId,
                    videoName,
                    frameCount: analysisResults.length,
                    timestamp: new Date().toISOString()
                });

                // 准备上传数据
                const uploadData = {
                    studentId: studentId,
                    videoName: videoName,
                    analysisData: analysisResults.map(r => ({
                        timestamp: r.timestamp,
                        emotion: r.emotion,
                        probabilities: r.probabilities
                    })),
                    summary: {
                        totalFrames: analysisResults.length,
                        emotionDistribution: emotions.map((name, idx) => ({
                            emotion: name,
                            count: emotionCounts[idx],
                            percentage: (analysisResults.length > 0
                                ? ((emotionCounts[idx] / analysisResults.length) * 100).toFixed(1)
                                : 0)
                        })),
                        duration: analysisResults.length > 0
                            ? analysisResults[analysisResults.length - 1].timestamp
                            : 0
                    },
                    createdAt: cloudbaseDb.serverDate()
                };

                console.log('[上传] 数据结构验证完成，开始上传...');

                statusText.textContent = '⏳ 正在上传到云端...';

                // 上传到 student_video 集合
                const result = await cloudbaseDb.collection('student_video').add(uploadData);

                console.log('[上传] ✅ 上传成功', result);

                statusText.textContent = '✅ 数据已上传到云端';
                showSuccess(`✅ 分析结果已保存到CloudBase！\n视频：${videoName}\n帧数：${analysisResults.length}`);
                exportBtn.disabled = false;

            } catch (err) {
                console.error('[上传] ❌ 上传失败', err);
                statusText.textContent = `❌ 上传失败: ${err.message}`;
                showError(`上传失败: ${err.message}\n\n请检查：\n1. 环境ID是否正确\n2. CloudBase匿名登录是否启用\n3. student_video集合是否存在`);
                exportBtn.disabled = false;
            }
        }

        // 导出按钮事件处理 - 优先上传到CloudBase，然后导出CSV
        exportBtn.addEventListener('click', async () => {
            try {
                // 先上传到CloudBase
                await uploadToCloudbase();

                // 上传成功后再导出CSV
                setTimeout(() => {
                    exportCSV();
                }, 500);
            } catch (err) {
                console.error('[导出] 错误:', err);
                // 如果上传失败，仍然允许导出CSV
                exportCSV();
            }
        });

        analyzeBtn.addEventListener('click', analyzeVideo);
    </script>
</body>
</html>
